name: Kairo
options:
  bundleIdPrefix: me.neima
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    KAIRO_BUILD_NUMBER: "1"
    CURRENT_PROJECT_VERSION: "$(KAIRO_BUILD_NUMBER)"
    KAIRO_GIT_SHA: "development"
    KAIRO_BUILD_DATE: "development"
    CODE_SIGN_STYLE: Automatic
    # Simulator builds stay unsigned so `xcodebuild test` and CI work with no
    # Apple account at all. Device builds sign with the team from
    # Signing.local.xcconfig (see ios/README.md → "Run on a real iPhone").
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
    CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: "NO"
    DEVELOPMENT_TEAM: "$(KAIRO_DEVELOPMENT_TEAM)"
targets:
  Kairo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.neima.kairo
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: App/Kairo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.neima.kairo
        com.apple.developer.healthkit: true
    dependencies:
      - target: KairoWidget
        embed: true
        ENABLE_PREVIEWS: "YES"
  KairoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Kairo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.neima.kairo.uitests
        TEST_TARGET_NAME: Kairo
  KairoUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
    dependencies:
      - target: Kairo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.neima.kairo.unittests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kairo.app/Kairo"
        BUNDLE_LOADER: "$(TEST_HOST)"
  KairoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.neima.kairo.widgets
        INFOPLIST_FILE: Widget/Info.plist
        SKIP_INSTALL: "YES"
    entitlements:
      path: Widget/KairoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.me.neima.kairo
schemes:
  Kairo:
    build:
      targets:
        Kairo: all
        KairoUITests: [test]
        KairoUnitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KairoUnitTests
        - KairoUITests

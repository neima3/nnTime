# Kairo CI — Phase 1B.
# Runs on every push and PR. Lint, typecheck, test (with an ephemeral Postgres
# service container for DB integration tests), and build.
# The contract-parity test (ADR-002 drift gate) and temporal matrix run as part
# of `pnpm test`; Playwright smoke is added in a later subphase.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres 16+ matches the Coolify-managed target.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kairo
          POSTGRES_PASSWORD: kairo
          POSTGRES_DB: kairo_test
        ports:
          - 5432:5432
        # Wait until the server accepts connections before continuing.
        options: >-
          --health-cmd "pg_isready -U kairo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The CI service container listens on localhost:5432 (runner network).
      TEST_DATABASE_URL: postgresql://kairo:kairo@localhost:5432/kairo_test
      DATABASE_URL: postgresql://kairo:kairo@localhost:5432/kairo_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + DB integration + contract parity)
        # The release-contract suites require Apple's plutil and run below on
        # macOS; every other Vitest suite remains on the Postgres-backed runner.
        run: >-
          pnpm exec vitest run
          --exclude tests/ios-release-contract.test.ts
          --exclude tests/ios-release-script.test.ts

      - name: Build
        run: pnpm build

  # ADR-002 — compile the generated Swift client from the exact canonical API
  # contract and guard the shipping app's manual calls against that contract.
  native-contract:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check canonical and shipping-client contracts
        run: |
          pnpm api:check-ios
          pnpm api:check-ios-client

      - name: Install Apple release tooling
        run: brew install xcodegen

      - name: Test Apple release contracts
        run: >-
          pnpm exec vitest run
          tests/ios-release-contract.test.ts tests/ios-release-script.test.ts

      - name: Build and test generated Swift client
        run: swift test --package-path ios/Kairo

  # T15 — real-browser core-loop suite (sign-up, plan/complete, capture,
  # clock format incl. SSR payload, offline replay). The app self-migrates on
  # startup, so the job only provides a DB and a throwaway auth secret.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kairo
          POSTGRES_PASSWORD: kairo
          POSTGRES_DB: kairo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kairo:kairo@localhost:5432/kairo_e2e
      BETTER_AUTH_SECRET: ci-e2e-throwaway-secret
      BETTER_AUTH_URL: http://localhost:3456

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: E2E (Playwright against pnpm start)
        run: pnpm test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: browser-qa/e2e-artifacts
          retention-days: 7
